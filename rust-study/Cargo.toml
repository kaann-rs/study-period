[workspace]
resolver = "3"
# Her yeni konu/bölüm kendi crate'i olur:
#   learn/*   → kitap bölümleri ve kavram çalışmaları (basic-concepts, struct, ...)
#   learn/advanced-concepts/<crate> → ileri konular (advanced-*): kitabın ötesindeki derinleşmeler.
#     Klasörün kendisi bir crate değildir; `learn/*` onu da yakaladığı için `exclude`a yazılır ve
#     içindeki crate'ler aşağıda TEK TEK sayılır (açıkça yazılan üye, exclude'dan önce gelir).
#     Yeni bir advanced-* crate'i eklerken buraya bir satır ekle.
#   project/* → daha büyük, kendi başına projeler (lox-rs, ahtapot-rs, actix-gcd)
# guide/ (rust-lang/rust) referans olarak durur, workspace'e dahil DEĞİL.
members = [
    "learn/*",
    "learn/advanced-concepts/advanced-coherence",
    "learn/advanced-concepts/advanced-concurrency-async",
    "learn/advanced-concepts/advanced-deref-methods",
    "learn/advanced-concepts/advanced-dropck",
    "learn/advanced-concepts/advanced-future",
    "learn/advanced-concepts/advanced-lifetime-hrtb-gat",
    "learn/advanced-concepts/advanced-send-sync",
    "learn/advanced-concepts/advanced-sized-dst",
    "learn/advanced-concepts/advanced-variance",
    "project/*",
]
exclude = ["guide", "learn/advanced-concepts"]
